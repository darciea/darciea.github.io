    - title: MNIST Digit Classifier
      year: Present
      description:
        - Building, containerizing, and deploying a simple digit recognizer trained on the MNIST dataset.
        - Trained PyTorch models locally, achieving an accuracy of 98.42% using CNNs.
        - Developed a Streamlit web app where users can draw a digit, submit it, and receive a prediction with confidence scores. Users can also provide true labels for data collection.
        - Logged the timestamp, predictions, true label from the Streamlit web app into a PostgreSQL database.
        - "Next steps: Containerizing the PyTorch model, Streamlit app, and database using Docker, and deploying to a self-managed server with public access."
    - title: MEng Individual Project - A Wearable Sensor to Measure Fetal Movements
      year: 2023-2024
      description:
        - Clinically validated a novel multi-modal wearable fetal movement monitor developed by the Imperial College Biomechatronics lab, enabling accurate at-home monitoring.
        - Conducted high-quality data collection from over 50 pregnant participants, integrating real-time ultrasound observations to enhance dataset reliability.
        - Applied supervised learning with a transformer-based model using TensorFlow to perform binary classification of fetal movements, improving distinction and detection accuracy.
    - title: Introduction to Robotics Projects
      year: 2023-2024
      description:
        - Designed a 4-DoF robotic manipulator using SolidWorks, performing kinematic analysis, and computational validation in MATLAB.
        - Developed a mobile robot to follow a path by extracting spatial map features using computer vision, applying algorithms to process and analyze map data for pathfinding.
    - title: Award-Winning 3rd Year Design, Make and Test Project
      year: 2022-2023
      description:
        - Awarded Arup Prize for Third Year Group Project.
